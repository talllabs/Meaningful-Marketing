<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meaningful Marketing — Mission-Driven Agency</title>
  <meta name="description" content="Meaningful Marketing helps mission-driven organizations reach wider audiences through websites, video, social, AI tools, and more. 15+ years of experience." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* MOBILE: remove duplicate logo */
    @media (max-width: 768px) {
      .nav__logo { display: none; }
    }

    /* HERO restructure */
    .hero {
      display: flex;
      flex-direction: column;
    }

    .hero__split {
      display: block; /* override split layout */
    }

    .hero__image {
      position: relative;
    }

    .hero__logo-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .hero__content {
      text-align: center;
      padding: 24px 16px 32px;
    }

    .hero__headline {
      display: none; /* remove duplicate big logo text */
    }

    .hero__ctas {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
    }

    @media (min-width: 768px) {
      .hero__ctas {
        flex-direction: row;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

<!-- NAV stays unchanged -->

<!-- ============ HERO ============ -->
<section class="hero" id="home">
  <div class="hero__noise"></div>

  <!-- IMAGE FIRST -->
  <div class="hero__image hero__carousel">
    <img class="hero__slide hero__slide--active" src="images/hero1.png" alt="Meaningful Marketing" />
    <img class="hero__slide" src="images/hero2.png" alt="Meaningful Marketing" />
    <img class="hero__slide" src="images/hero3.jpg" alt="Meaningful Marketing" />
    <img class="hero__slide" src="images/hero4.jpg" alt="Meaningful Marketing" />
    <img class="hero__slide" src="images/hero5.jpg" alt="Meaningful Marketing" />
    <img class="hero__slide" src="images/hero6.jpg" alt="Meaningful Marketing" />
    <img class="hero__slide" src="images/hero7.jpg" alt="Meaningful Marketing" />
    <img class="hero__slide" src="images/hero8.jpg" alt="Meaningful Marketing" />

    <!-- LOGO OVERLAY -->
    <div class="hero__logo-overlay">
      <div class="logo-mark">
        <span class="logo-mark__top">MEANINGFUL</span>
        <span class="logo-mark__bot">MARKETING</span>
      </div>
    </div>

    <div class="hero__dots">
      <button class="hero__dot hero__dot--active" data-index="0"></button>
      <button class="hero__dot" data-index="1"></button>
      <button class="hero__dot" data-index="2"></button>
      <button class="hero__dot" data-index="3"></button>
      <button class="hero__dot" data-index="4"></button>
      <button class="hero__dot" data-index="5"></button>
      <button class="hero__dot" data-index="6"></button>
      <button class="hero__dot" data-index="7"></button>
    </div>
  </div>

  <!-- THEN TEXT -->
  <div class="hero__content container">
    <p class="hero__eyebrow">Serving Mission-Driven Organizations Since 2009</p>

    <div class="hero__ctas">
      <button class="btn btn--primary js-open-calendly">Schedule an Intro Call</button>
      <a href="#work" class="btn btn--ghost">See Our Work ↓</a>
    </div>
  </div>
</section>
