<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Andean Health &amp; Development</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/for-ahd/images/ahd-mark.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@500;700&display=swap" rel="stylesheet">
  <script src="/for-ahd/gate.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px; font-family: 'Work Sans', system-ui, sans-serif; color: #172e3a; background: #f7f2ed; }
    main { width: 100%; max-width: 520px; text-align: center; }
    main > img { width: 140px; margin: 0 auto 28px; display: block; }
    a.card { display: block; text-decoration: none; color: inherit; background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 18px 50px rgba(6,103,152,.14); transition: transform .25s, box-shadow .25s; text-align: left; }
    a.card:hover { transform: translateY(-5px); box-shadow: 0 26px 64px rgba(6,103,152,.22); }
    .top { background: #066798; color: #fff; padding: 28px 28px 24px; border-bottom: 6px solid #f08519; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: #f1bf34; }
    .top h1 { margin: 8px 0 0; font-size: clamp(28px, 6vw, 36px); line-height: 1.05; letter-spacing: -1px; }
    .body { padding: 22px 28px 26px; }
    .body p { margin: 0 0 16px; font-size: 17px; line-height: 1.5; color: #4a5a63; }
    .go { font-weight: 700; color: #066798; }
    footer { margin-top: 26px; font-size: 14px; color: #6b7378; }
  </style>
</head>
<body>
  <main>
    <img src="/for-ahd/images/ahd-logo.png" alt="Andean Health &amp; Development">
    <a class="card" href="/for-ahd/newsletter/">
      <div class="top">
        <span class="eyebrow">Email mockup</span>
        <h1>Fall 2026 Newsletter</h1>
      </div>
      <div class="body">
        <p>A mockup of the email newsletter, designed to match the new andeanhealth.org.</p>
        <span class="go">View the newsletter →</span>
      </div>
    </a>
    <footer>Prepared by Meaningful Marketing</footer>
  </main>
</body>
</html>
